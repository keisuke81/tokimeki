		<!-- wp:group {"className":"header","layout":{"type":"flex","flexWrap":"wrap","justifyContent":"space-between"}} -->

			<!-- /wp:heading -->
		</div>

			<!-- wp:column {"width":"30%"} -->
			<div class="wp-block-column" style="flex-basis:30%">
				<!-- wp:heading {"level":2,"style":{"typography":{"fontSize":"clamp(1.5rem, 3vw, 2rem)","letterSpacing":"0.1em","textTransform":"uppercase","fontWeight":"400"}},"className":"section-label"} -->
